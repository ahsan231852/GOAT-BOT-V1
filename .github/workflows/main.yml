name: GoatBot 6H Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Bot (6 hours)
      run: |
        npm start &
        sleep 21600
        pkill -f node || true

    - name: Save data to repo
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add .
        git commit -m "auto save data" || echo "no changes"
        git push
